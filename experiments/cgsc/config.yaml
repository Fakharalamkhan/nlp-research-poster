# cgsc/config.yaml -- Configuration for confidence-gated self-correction experiments

project_name: "confidence-gated-self-correction"
seed: 42

models:
  qwen:
    name: "Qwen/Qwen2.5-7B-Instruct"
    alias: "Qwen2.5-7B-Instruct"
    latex_macro: "\\modelA{}"
  llama:
    name: "meta-llama/Llama-3.1-8B-Instruct"
    alias: "Llama-3.1-8B-Instruct"
    latex_macro: "\\modelB{}"

datasets:
  gsm8k:
    hf_path: "openai/gsm8k"
    hf_config: "main"
    hf_split: "test"
    n_sample: 500
    n_dev: 100
    n_test: 400
  hotpotqa:
    hf_path: "hotpotqa/hotpot_qa"
    hf_config: "distractor"
    hf_split: "validation"
    n_sample: 500
    n_dev: 100
    n_test: 400

inference:
  max_model_len: 8192
  enable_prefix_caching: true
  tensor_parallel_size: 2
  a0:
    temperature: 0.0
    max_tokens: 768
  verb:
    temperature: 0.0
    max_tokens: 8
  sc:
    temperature: 0.7
    top_p: 0.95
    n_samples: 10
    max_tokens: 768
  verif:
    temperature: 0.0
    max_tokens: 1
    logprobs: 20
  revision:
    temperature: 0.0
    max_tokens: 768
  ioe:
    temperature: 0.0
    max_tokens: 768

data_dir: "cgsc/data"
prompts_dir: "cgsc/prompts"
results_dir: "results"
